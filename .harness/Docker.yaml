kind: pipeline
spec:
  stages:
    - name: build
      type: ci
      spec:
        volumes:
          - name: dockersock
            spec:
              path: /var/run/docker.sock
            type: host
        platform:
          arch: amd64
          os: linux
        steps:
          # Build and push the main application image (multi-arch buildx)
          - name: build_main_image
            type: script
            privileged: true
            spec:
              image: docker:27-cli
              env:
                DOCKER_API_VERSION: "1.44"
              run: |-
                set -e

                echo "==> Setup binfmt_misc for multi-arch"
                docker run --rm --privileged tonistiigi/binfmt --install all

                echo "==> Create and bootstrap buildx builder"
                docker buildx create --name multi-builder --use || docker buildx use multi-builder
                docker buildx inspect --bootstrap

                echo "==> Build and push multi-arch image"
                docker buildx build \
                  --platform linux/amd64,linux/arm64 \
                  -t docker-registry.dolphin-puffin.ts.net/bursar:latest \
                  -t docker-registry.dolphin-puffin.ts.net/bursar:v${{ build.number }} \
                  -f Dockerfile \
                  --push . \
                  --progress=plain

                echo "==> Inspect pushed image"
                docker buildx imagetools inspect docker-registry.dolphin-puffin.ts.net/bursar:latest || echo "Image not found"
              mount:
                - name: dockersock
                  path: /var/run/docker.sock

          # Clean up Docker build cache
          - name: cleanup_build_cache
            type: script
            spec:
              image: docker:27-cli
              env:
                DOCKER_API_VERSION: "1.44"
              run: |-
                echo "Pruning Docker build cache..."
                docker buildx prune -af
              mount:
                - name: dockersock
                  path: /var/run/docker.sock
              when: always()
version: 1
