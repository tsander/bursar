version: 1
kind: pipeline
spec:
  stages:
  - name: build
    spec:
      platform:
        arch: amd64
        os: linux
      steps:
      - name: docker_build
        spec:
          inputs:
            repo: docker-registry.dolphin-puffin.ts.net/bursar
            registry: docker-registry.dolphin-puffin.ts.net
            tags: v${{ build.number }}
          name: docker
        type: plugin
    type: ci
