name: Build and Push Multi-Arch Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Optional: use a specific image that has docker-cli pre-installed
    container:
      image: catthehacker/ubuntu:act-latest
      privileged: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug Secrets
        run: |
          if [ -z "${{ secrets.DOCKER_HUB_USERNAME }}" ]; then
            echo "❌ ERROR: DOCKER_HUB_USERNAME is empty or missing!"
          else
            echo "✅ DOCKER_HUB_USERNAME is set."
          fi

          if [ -z "${{ secrets.DOCKER_HUB_PASSWORD }}" ]; then
            echo "❌ ERROR: DOCKER_HUB_PASSWORD is empty or missing!"
          else
            echo "✅ DOCKER_HUB_PASSWORD is set."
          fi
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker-registry.dolphin-puffin.ts.net/bursar:latest
            docker-registry.dolphin-puffin.ts.net/bursar:v${{ gitea.run_number }}